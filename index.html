
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP Info Lookup</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1117;color:#e6e6e6;
       display:flex;justify-content:center;padding:40px;margin:0}
  .card{width:100%;max-width:520px;background:#1a1d27;border-radius:14px;
        padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  h1{font-size:20px;margin:0 0 18px}
  input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;
        border:1px solid #2e3342;background:#0f1117;color:#fff;font-size:16px}
  button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;
         background:#5865f2;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  pre{margin-top:18px;background:#0f1117;padding:16px;border-radius:10px;
      white-space:pre-wrap;word-break:break-word;font-size:14px;min-height:20px}
  img{width:100%;margin-top:14px;border-radius:10px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>فحص معلومات الـ IP</h1>
  <input id="ip" placeholder="حط الايبي هنا، مثال: 8.8.8.8" autocomplete="off">
  <button id="go">فحص وإرسال</button>
  <pre id="out">—</pre>
  <img id="map">
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1553644353488945192/VDY-S6DfRwy-aV74hwuB0BNwGVoyYbr1RKNFQKbWAv-tuLjC5kwKoPtsbyAteXs9EaNi";

const out = document.getElementById('out');
const map = document.getElementById('map');
const btn = document.getElementById('go');

btn.onclick = async () => {
  const ip = document.getElementById('ip').value.trim();
  if (!ip) return;

  out.textContent = 'جاري الفحص...';
  btn.disabled = true;
  map.style.display = 'none';

  let d;
  try {
    const r = await fetch(`https://ipwho.is/${encodeURIComponent(ip)}`);
    d = await r.json();
    if (!d.success) throw new Error(d.message || 'ايبي غير صالح');
  } catch (e) {
    out.textContent = '❌ فشل جلب المعلومات: ' + e.message;
    console.error('lookup error', e);
    btn.disabled = false;
    return;
  }

  const conn = d.connection || {};
  const maps = `https://www.google.com/maps?q=${d.latitude},${d.longitude}`;
  const text =
`IP: ${d.ip}
Country: ${d.country}
Region: ${d.region}
City: ${d.city}
Coords: ${d.latitude}, ${d.longitude}
Timezone: ${(d.timezone && d.timezone.id) || '-'}
ISP: ${conn.isp || '-'}
Org: ${conn.org || '-'}
ASN: ${conn.asn ? 'AS' + conn.asn : '-'}
Maps: ${maps}
(موقع تقديري على مستوى المدينة فقط)`;

  out.textContent = text;
  map.src = `https://staticmap.openstreetmap.de/staticmap.php?center=${d.latitude},${d.longitude}&zoom=10&size=520x260&markers=${d.latitude},${d.longitude},red-pushpin`;
  map.style.display = 'block';

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: 'ip',
        embeds: [{
          title: 'IP Lookup',
          color: 5793266,
          description: '```' + text + '```'
        }]
      })
    });

    if (res.status === 204) {
      out.textContent += '\n\n✅ تم الإرسال للويبهوك.';
    } else {
      const body = await res.text();
      out.textContent += `\n\n❌ ديسكورد رفض الطلب (${res.status}): ${body}`;
      console.error('webhook error', res.status, body);
    }
  } catch (e) {
    out.textContent += '\n\n❌ فشل الاتصال بالويبهوك: ' + e.message;
    console.error('webhook fetch error', e);
  }
  btn.disabled = false;
};
</script>
</body>
</html>
