<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP Info Lookup</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1117;color:#e6e6e6;
       display:flex;justify-content:center;padding:40px;margin:0}
  .card{width:100%;max-width:520px;background:#1a1d27;border-radius:14px;
        padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  h1{font-size:20px;margin:0 0 18px}
  input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;
        border:1px solid #2e3342;background:#0f1117;color:#fff;font-size:16px}
  button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;
         background:#5865f2;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  pre{margin-top:18px;background:#0f1117;padding:16px;border-radius:10px;
      white-space:pre-wrap;word-break:break-word;font-size:14px;min-height:20px}
  img{width:100%;margin-top:14px;border-radius:10px;display:none}
  a{color:#8ab4ff}
</style>
</head>
<body>
<div class="card">
  <h1>فحص معلومات الـ IP</h1>
  <input id="ip" placeholder="حط الايبي هنا، مثال: 8.8.8.8" autocomplete="off">
  <button id="go">فحص وإرسال</button>
  <pre id="out">—</pre>
  <img id="map">
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/xxx/yyy";

const out = document.getElementById('out');
const map = document.getElementById('map');
const btn = document.getElementById('go');

btn.onclick = async () => {
  const ip = document.getElementById('ip').value.trim();
  if (!ip) return;

  out.textContent = 'جاري الفحص...';
  btn.disabled = true;
  map.style.display = 'none';

  try {
    const r = await fetch(`http://ip-api.com/json/${encodeURIComponent(ip)}?fields=status,message,country,regionName,city,zip,lat,lon,timezone,isp,org,as,query`);
    const d = await r.json();

    if (d.status !== 'success') {
      out.textContent = 'خطأ: ' + (d.message || 'ايبي غير صالح');
      btn.disabled = false;
      return;
    }

    const maps = `https://www.google.com/maps?q=${d.lat},${d.lon}`;
    const text =
`IP: ${d.query}
Country: ${d.country}
Region: ${d.regionName}
City: ${d.city}
Zip: ${d.zip || '-'}
Coords: ${d.lat}, ${d.lon}
Timezone: ${d.timezone}
ISP: ${d.isp}
Org: ${d.org}
ASN: ${d.as}
Maps: ${maps}
(موقع تقديري على مستوى المدينة فقط)`;

    out.textContent = text;

    map.src = `https://staticmap.openstreetmap.de/staticmap.php?center=${d.lat},${d.lon}&zoom=10&size=520x260&markers=${d.lat},${d.lon},red-pushpin`;
    map.style.display = 'block';

    await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: 'ip',
        embeds: [{
          title: 'IP Lookup',
          color: 5793266,
          description: '```' + text + '```'
        }]
      })
    });

    out.textContent += '\n\n✅ تم الإرسال للويبهوك.';
  } catch (e) {
    out.textContent = 'خطأ: ' + e.message;
  }
  btn.disabled = false;
};
</script>
</body>
</html>
